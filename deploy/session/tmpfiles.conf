# /etc/tmpfiles.d/agino-session.conf
# Runtime parent of the per-slot run directories /run/agino-session/<slot>/ (slot = vm0, vm1, ...).
# The daemon (agino-sandbox) writes, the platform (agino-admin) may traverse. setgid: the slot directories and
# web.sock created below inherit group agino-admin without the daemon being a member (and the unit has
# RestrictSUIDSGID, so the daemon could not set the bit itself).
d /run/agino-session 2750 agino-sandbox agino-admin -
# Captures of finished and running sessions: agino-sandbox writes, agino-store (shots-session-import) reads.
d /srv/store/sandbox/captures 2750 agino-sandbox agino-store -
