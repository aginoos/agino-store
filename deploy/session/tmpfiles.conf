# /etc/tmpfiles.d/agino-session.conf
# Runtime parent of the per-slot run directories /run/agino-session/<slot>/ (slot = vm0, vm1, ...).
# The daemon (agino-sandbox) writes, the platform (agino-admin) may traverse.
d /run/agino-session 0750 agino-sandbox agino-admin -
# Captures of finished and running sessions: agino-sandbox writes, agino-store (shots-session-import) reads.
d /srv/store/sandbox/captures 2750 agino-sandbox agino-store -
