<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.aginoos.Store1"/>
  </policy>
  <!-- Authorization is done inside the helper (polkit, docs/design.md section 6); everyone may call. -->
  <policy context="default">
    <allow send_destination="org.aginoos.Store1" send_interface="org.aginoos.Store1"/>
    <allow send_destination="org.aginoos.Store1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.aginoos.Store1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
