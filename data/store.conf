[Catalog]
# Base URL of the signed catalog; file:// works for testing.
Url=https://store.aginoos.com/v1/
# Directories with trusted public keys (*.pub).
KeyDirs=/usr/share/agino-store/keys
# Test-only: also accept http:// and file:// URLs for the catalog and the debs. Keep false.
AllowInsecureUrls=false

[Packages]
# Never removed through the store.
Protected=agino-desktop-dde;agino-desktop-base;dde-session-shell;dde-shell;dde-control-center;agino-store
